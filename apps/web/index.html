<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentFi | Swarm Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-effects">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <div class="dashboard">
        <header class="glass-header">
            <div class="logo">
                <span class="logo-icon">💠</span>
                <h1>AgentFi</h1>
            </div>
            <div class="header-stats">
                <div class="stat-badge">
                    <span class="label">Network</span>
                    <span class="value success">Base Sepolia</span>
                </div>
                <div class="stat-badge">
                    <span class="label">Active Agents</span>
                    <span class="value">5 / 5</span>
                </div>
            </div>
        </header>

        <main class="grid-container">
            <!-- Left Column: Swarm Status -->
            <section class="glass-panel agents-panel">
                <h2>Autonomous Swarm</h2>
                <div class="agent-list" id="agent-list">
                    <!-- Populated by JS -->
                </div>
            </section>

            <!-- Middle Column: Live Feeds -->
            <section class="glass-panel feed-panel">
                <h2>Live Intelligence Feed</h2>
                <div class="feed-container" id="live-feed">
                    <!-- Populated by JS -->
                </div>
            </section>

            <!-- Right Column: Performance & EAS -->
            <section class="right-col">
                <div class="glass-panel chart-panel">
                    <h2>Swarm Confidence</h2>
                    <div class="confidence-meter">
                        <svg viewBox="0 0 36 36" class="circular-chart">
                            <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path class="circle" id="confidence-circle" stroke-dasharray="85, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <text x="18" y="20.35" class="percentage" id="confidence-text">85%</text>
                        </svg>
                        <div class="signal-text" id="signal-text">STRONG BUY (ETH)</div>
                    </div>
                </div>

                <div class="glass-panel eas-panel">
                    <h2>Verifiable AI (EAS)</h2>
                    <p class="eas-subtitle">Latest On-chain Attestations</p>
                    <div class="eas-list" id="eas-list">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
